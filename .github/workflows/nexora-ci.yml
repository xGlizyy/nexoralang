# Continuous integration for NEXORA: the core (nexora/) and the npm package (npm/). The server and
# the web live in a separate private repository, with their own continuous integration.
#
# STATUS: active. Runs on every change to `main` that touches the paths below.
#
# - It uses no secrets and no paid services: only free GitHub runners.
# - The main branch is called "main".
# - If nexora/ becomes the root of its own repository, delete the two
#   "working-directory" lines and the "paths" filters.

name: nexora-ci

on:
  push:
    branches: [main, feature/server-hardening]
    paths: ["nexora/**", "npm/**", "vscode-nexora/**", "docs/**", "ejemplos/**", "LICENSE", "README.md", ".github/workflows/nexora-ci.yml"]
  pull_request:
    paths: ["nexora/**", "npm/**", "vscode-nexora/**", "docs/**", "ejemplos/**", "LICENSE", "README.md", ".github/workflows/nexora-ci.yml"]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install NEXORA and the development tools
        run: python -m pip install -e ".[dev]"

      - name: Static analysis of the code
        run: python -m ruff check src tests

      # The equivalence tests with 0.11.0 (T1-T4) are left out here on purpose, and run once in the
      # job "equivalence" below. Coverage does not change: they only run nex in subprocesses.
      - name: Tests with coverage
        if: (matrix.os != 'macos-latest' || matrix.python != '3.11') && (matrix.os != 'ubuntu-latest' || matrix.python != '3.13')
        run: python -m pytest --cov -m "not equivalence"

      # Keep the newest Linux/Python combination actionable if a test stops making progress.
      - name: Tests with coverage (Ubuntu 3.13 diagnostics)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m pytest -v --cov -m "not equivalence" -o faulthandler_timeout=120

      # This runner has stalled without identifying the current test. Keep verbose progress and
      # periodic thread dumps here so a slow or blocked test is actionable in the Actions log.
      - name: Tests with coverage (macOS 3.11 diagnostics)
        if: matrix.os == 'macos-latest' && matrix.python == '3.11'
        run: python -m pytest -vv --cov -m "not equivalence" -o faulthandler_timeout=120

      - name: The installed command works
        run: |
          nex --version
          nex run examples/hello.nex

  equivalence:
    # T1-T4 of decision 0019 (8.9): the published nexora-lang 0.11.0 on the frozen corpus, against
    # this version on the programs nex migrate writes. One job, Ubuntu and Python 3.12. No cache:
    # the wheel is downloaded and its SHA-256 checked on every run. NEXORA_SKIP_EQUIVALENCE is never
    # set here; with CI set, the tests fail instead of skipping if it is.
    name: Equivalence with 0.11.0 (T1-T4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NEXORA and the development tools
        run: python -m pip install -e ".[dev]"

      - name: Install the published nexora-lang 0.11.0, pinned by the SHA-256 of its wheel
        run: |
          cat tests/migration/nexora-0.11.0.txt
          python -m venv "$RUNNER_TEMP/nexora-0.11.0"
          "$RUNNER_TEMP/nexora-0.11.0/bin/python" -m pip install --no-deps --require-hashes \
            --only-binary=:all: --no-cache-dir -r tests/migration/nexora-0.11.0.txt

      - name: Show what the 0.11.0 environment is
        run: |
          grep include-system-site-packages "$RUNNER_TEMP/nexora-0.11.0/pyvenv.cfg"
          "$RUNNER_TEMP/nexora-0.11.0/bin/python" -I -c \
            "import nexora; print('nexora', nexora.__version__, 'from', nexora.__file__)"

      - name: T1-T4 against 0.11.0
        env:
          NEXORA_011_PYTHON: ${{ runner.temp }}/nexora-0.11.0/bin/python
        # -m equivalence selects only these tests; if none were collected pytest exits with 5.
        run: python -m pytest -m equivalence -v -rs

  package:
    name: Installable package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install build
          python -m build

      - name: Install the package in a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/nex --version
          /tmp/clean/bin/nex run examples/hello.nex

  npm:
    name: npm package · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Node 26 is a non-blocking (experimental) run: if it fails, the workflow does not fail.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 18: the minimum declared by npm/package.json (engines ">=18"). It no longer has official
        # support (since 2025-04-30), but it is tested while the package declares it; it is also earlier than
        # the `node --test` patterns (Node 21). 22 and 24: the supported LTS lines. Node 20 was removed as
        # redundant for what this job checks today: the case before Node 21 is already covered by 18.
        node: ["18", "22", "24"]
        include:
          # Node 26, still untested: only on Linux and non-blocking.
          - os: ubuntu-latest
            node: "26"
            experimental: true
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Launcher tests
        run: npm test

      - name: Install the generated package and use it
        shell: bash
        run: |
          npm pack
          npm install -g ./nexora-lang-*.tgz
          nex --version
          nex run ../nexora/examples/hello.nex
