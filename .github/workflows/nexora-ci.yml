# Integración continua de NEXORA: el núcleo (nexora/), el paquete de npm (npm/) y el servidor del
# playground con la web (servidor/, web/).
#
# ESTADO: preparado, nunca ejecutado. El proyecto todavía no tiene repositorio en GitHub.
# Se activará solo al publicar el repositorio con este archivo en .github/workflows/.
#
# - No usa secretos ni servicios de pago: solo ejecutores gratuitos de GitHub.
# - Si la rama principal no se llama "main", cambia la lista de "branches".
# - Si nexora/ pasa a ser la raíz de su propio repositorio, elimina las dos líneas
#   "working-directory" y los filtros "paths".

name: nexora-ci

on:
  push:
    branches: [main]
    paths: ["nexora/**", "npm/**", "servidor/**", "web/**", "LICENSE", ".github/workflows/nexora-ci.yml"]
  pull_request:
    paths: ["nexora/**", "npm/**", "servidor/**", "web/**", "LICENSE", ".github/workflows/nexora-ci.yml"]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar NEXORA y las herramientas de desarrollo
        run: python -m pip install -e ".[dev]"

      - name: Análisis estático del código
        run: python -m ruff check src tests

      - name: Pruebas con cobertura
        run: python -m pytest --cov

      - name: El comando instalado funciona
        run: |
          nex --version
          nex run examples/hello.nex

  package:
    name: Paquete instalable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el paquete
        run: |
          python -m pip install build
          python -m build

      - name: Instalar el paquete en un entorno limpio y usarlo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/nex --version
          /tmp/clean/bin/nex run examples/hello.nex

  npm:
    name: Paquete de npm · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Node 26 es una prueba no bloqueante (experimental): si falla, el flujo no falla.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 18: el mínimo que declara npm/package.json (engines ">=18"). Ya no tiene soporte oficial
        # (desde el 30/04/2025), pero se prueba mientras el paquete lo declare; también es anterior a
        # los patrones de `node --test` (Node 21). 22 y 24: las LTS con soporte. Node 20 se quitó por
        # redundante para lo que comprueba este trabajo hoy: el caso anterior a Node 21 ya lo cubre 18.
        node: ["18", "22", "24"]
        include:
          # Node 26, todavía sin probar: solo en Linux y sin bloquear.
          - os: ubuntu-latest
            node: "26"
            experimental: true
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Pruebas del lanzador
        run: npm test

      - name: Instalar el paquete generado y usarlo
        shell: bash
        run: |
          npm pack
          npm install -g ./nexora-lang-*.tgz
          nex --version
          nex run ../nexora/examples/hello.nex

  servidor:
    name: Servidor y web · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Node 26 es una prueba no bloqueante (experimental): si falla, el flujo no falla.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # servidor/package.json admite "^22.23.2 || ^24.18.1".
        # 22.23.2 y 24.18.1: los mínimos, fijos (las últimas versiones de seguridad de cada rama en
        # octubre de 2026).
        # "22" y "24": la última versión de cada rama, para detectar regresiones de versiones nuevas.
        node: ["22.23.2", "24.18.1", "22", "24"]
        include:
          # Node 26, fuera de engines hasta validarlo: solo en Linux y sin bloquear.
          - os: ubuntu-latest
            node: "26"
            experimental: true
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # El playground ejecuta el intérprete con `python -I -m nexora.worker`. NEXORA_PYTHON le dice
      # cuál: sin él buscaría nexora/.venv, que en el CI no existe.
      - name: Instalar el intérprete
        run: python -m pip install -e ../nexora

      - name: Instalar las dependencias del servidor
        run: npm ci

      - name: Pruebas del servidor y la web
        env:
          NEXORA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm test
