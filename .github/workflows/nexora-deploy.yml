# Despliegue de NEXORA en nexoralang.org. Guía: deploy/README.md
#
# Solo despliega un commit de `main` cuyo nexora-ci ha terminado bien:
#   1. staging: sube la versión al VPS, la activa en staging.nexoralang.org y la comprueba desde fuera.
#   2. production: espera la aprobación del environment "production" en GitHub y promueve ese mismo
#      commit. El VPS (deploy/bin/nexora-deploy) se niega a promover algo que no esté en staging y
#      verificado.
#
# Secretos: DEPLOY_SSH_KEY y DEPLOY_KNOWN_HOSTS (repositorio), STAGING_BASIC_AUTH (environment staging,
# "usuario:contraseña"). Variable: DEPLOY_HOST.

name: nexora-deploy

on:
  workflow_run:
    workflows: [nexora-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexora-deploy
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  staging:
    name: Staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.nexoralang.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Solo lo que usa el servidor: la web, el propio servidor, las carpetas que publica y los ejemplos
      # del playground (nexora/examples, que se leen al arrancar aunque el playground esté apagado).
      - name: Preparar la versión
        run: |
          mkdir build
          git archive "$SHA" web servidor docs ejemplos nexora/examples | tar -x -C build
          (cd build/servidor && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          echo "$SHA" > build/REVISION
          tar -czf release.tgz -C build .

      - name: Clave de despliegue
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy

      - name: Activar en staging
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "nexora-deploy@${{ vars.DEPLOY_HOST }}" "stage $SHA" < release.tgz

      - name: Comprobar staging desde fuera
        env:
          STAGING_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          for path in /api/health / /docs /guide /playground /login /signup /aviso-legal /privacidad /cookies /terminos /styles.css /js/main.js; do
            curl -fsS -o /dev/null --retry 3 --retry-delay 2 -u "$STAGING_BASIC_AUTH" -w "%{http_code} $path\n" "https://staging.nexoralang.org$path"
          done
          curl -fsS -u "$STAGING_BASIC_AUTH" https://staging.nexoralang.org/api/health | grep -q '"status":"ok"'

      - name: Marcar como verificada
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "nexora-deploy@${{ vars.DEPLOY_HOST }}" "verified $SHA" < /dev/null

  production:
    name: Producción
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nexoralang.org
    steps:
      # Si el environment no existe o no exige revisión, GitHub no espera a nadie: entonces este job
      # se niega a seguir antes de tocar el VPS. Cualquier error al consultarlo también lo detiene.
      - name: Exigir la aprobación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${{ github.repository }}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]] | length')
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "::error::El environment production no exige revisión: no se despliega."
            exit 1
          fi

      - name: Clave de despliegue
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy

      - name: Promover a producción
        run: ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "nexora-deploy@${{ vars.DEPLOY_HOST }}" "promote $SHA" < /dev/null

      - name: Comprobar producción desde fuera
        run: |
          for path in /api/health / /docs /guide /playground /login /signup /aviso-legal /privacidad /cookies /terminos; do
            curl -fsS -o /dev/null --retry 3 --retry-delay 2 -w "%{http_code} $path\n" "https://nexoralang.org$path"
          done
          curl -fsS https://nexoralang.org/api/health | grep -q '"status":"ok"'
