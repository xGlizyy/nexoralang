# /etc/nginx/snippets/nexora-edge.conf, incluido en cada server de NEXORA (puerto 443).
# Solo se atiende a Cloudflare: una conexión directa a la IP del servidor se corta sin respuesta.
if ($nexora_via_cloudflare = 0) {
    return 444;
}
# La dirección de la visita es la que Cloudflare pone en CF-Connecting-IP.
include /etc/nginx/nexora/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;

ssl_certificate     /etc/ssl/cloudflare/nexoralang.org.pem;
ssl_certificate_key /etc/ssl/cloudflare/nexoralang.org.key;
