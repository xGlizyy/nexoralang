# /etc/nginx/sites-available/nexoralang.org (enlazado en sites-enabled).
# Cloudflare (SSL "Full (strict)") -> nginx con el certificado de origen -> Node en 127.0.0.1.

upstream nexora_production {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream nexora_staging {
    server 127.0.0.1:3101;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexoralang.org www.nexoralang.org staging.nexoralang.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexoralang.org;
    include /etc/nginx/snippets/nexora-edge.conf;
    return 301 https://nexoralang.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexoralang.org;
    include /etc/nginx/snippets/nexora-edge.conf;

    location / {
        proxy_pass http://nexora_production;
        include /etc/nginx/snippets/nexora-proxy.conf;
    }
}

# Staging: lo que va a producción se comprueba aquí antes. Con contraseña y fuera de los buscadores.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.nexoralang.org;
    include /etc/nginx/snippets/nexora-edge.conf;

    auth_basic "NEXORA staging";
    auth_basic_user_file /etc/nginx/nexora/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://nexora_staging;
        include /etc/nginx/snippets/nexora-proxy.conf;
    }
}
