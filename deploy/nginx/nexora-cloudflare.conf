# /etc/nginx/conf.d/nexora-cloudflare.conf (contexto http). Solo define una variable con nombre propio:
# no cambia nada en los otros sitios del servidor. $realip_remote_addr es la dirección de la conexión
# real, también después de que real_ip la sustituya por la de la visita.
geo $realip_remote_addr $nexora_via_cloudflare {
    default 0;
    include /etc/nginx/nexora/cloudflare-geo.conf;
}
